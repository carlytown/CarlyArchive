name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Allow external triggers (e.g. Notion automation hitting the GitHub API
  # when a new status/row is added). POST to:
  #   https://api.github.com/repos/<owner>/<repo>/dispatches
  # with body: { "event_type": "notion-update" }
  repository_dispatch:
    types: [notion-update]
  schedule:
    # Every 5 minutes — picks up new Notion edits (especially statuses) quickly.
    # Public repos get unlimited GitHub Actions minutes on the free tier.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - name: Fetch Notion + enrich
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
