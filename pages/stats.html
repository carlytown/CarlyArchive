<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stats ♡ Carly's Archive</title>
  <link rel="stylesheet" href="../css/theme.css" />
</head>
<body>
  <div class="page">
    <header class="banner">
      <h1>✨ stats</h1>
      <div class="tagline">~ the numbers behind the archive ~</div>
    </header>
    <nav class="nav" aria-label="Main">
      <a href="../index.html">♡ home</a>
      <a href="./statuses.html">📝 statuses</a>
      <a href="./books.html">📚 books</a>
      <a href="./manga.html">📖 manga</a>
      <a href="./cds.html">💿 cds</a>
      <a href="./concerts.html">🎤 concerts</a>
      <a href="./anime.html">🌸 anime</a>
      <a href="./tv.html">📺 tv</a>
      <a href="./movies.html">🎬 movies</a>
      <a href="./games.html">🎮 games</a>
      <a href="./travel.html">✈️ travel</a>
      <a href="./music.html">🎧 music</a>
      <a href="./stats.html">✨ stats</a>
    </nav>
    <main class="main">
      <h2>totals</h2>
      <div id="totals" class="stat-grid">
        <p class="empty-state">loading…</p>
      </div>
      <hr class="cute" />
      <h2>by year</h2>
      <div id="by-year"></div>
      <hr class="cute" />
      <h2>top tags / genres</h2>
      <div id="top-tags"></div>
      <div id="tag-results" hidden></div>
    </main>
  </div>
  <script src="../js/sparkle.js"></script>
  <script type="module">
    import { injectFooter, highlightNav } from '../js/layout.js';
    highlightNav(); injectFooter();

    const ICONS = {
      books:'📚', cds:'💿', concerts:'🎤', anime:'🌸',
      tv:'📺', movies:'🎬', games:'🎮', travel:'✈️'
    };

    (async () => {
      let stats;
      try {
        const res = await fetch('../data/stats.json');
        if (!res.ok) throw 0;
        stats = await res.json();
      } catch {
        document.getElementById('totals').innerHTML =
          '<p class="empty-state">no stats yet — run the build script ♡</p>';
        return;
      }

      const totals = document.getElementById('totals');
      totals.innerHTML = '';
      Object.entries(stats.totals || {}).forEach(([cat, n]) => {
        const c = document.createElement('div');
        c.className = 'stat-card';
        c.innerHTML = `<span class="num">${n}</span>${ICONS[cat] || ''} ${cat}`;
        totals.appendChild(c);
      });

      const byYear = document.getElementById('by-year');
      if (stats.byYear) {
        const max = Math.max(1, ...Object.values(stats.byYear).flatMap(v => Object.values(v)));
        const years = [...new Set(Object.values(stats.byYear).flatMap(v => Object.keys(v)))].sort();
        byYear.innerHTML = years.map(y => {
          const segs = Object.entries(stats.byYear).map(([cat, m]) => {
            const v = m[y] || 0;
            if (!v) return '';
            const w = (v / max) * 100;
            return `<span title="${cat}: ${v}" style="display:inline-block;width:${w}%;background:var(--pink-magenta);height:14px;margin-right:2px;border-radius:3px;"></span>`;
          }).join('');
          return `<div style="margin:0.3rem 0;font-size:0.9rem;"><strong>${y}</strong> ${segs}</div>`;
        }).join('') || '<p class="empty-state">no dated entries yet.</p>';
      }

      const topTags = document.getElementById('top-tags');
      const tagResults = document.getElementById('tag-results');

      // Lazy-load all items once a tag is clicked.
      let allItems = null;
      async function loadAll() {
        if (allItems) return allItems;
        try {
          const r = await fetch('../data/all.json');
          if (!r.ok) throw 0;
          allItems = await r.json();
        } catch { allItems = []; }
        return allItems;
      }

      function escapeHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function tagMatches(item, tag) {
        const t = tag.toLowerCase();
        if (Array.isArray(item.tags) && item.tags.some(x => String(x).toLowerCase() === t)) return true;
        if (Array.isArray(item.genre) && item.genre.some(x => String(x).toLowerCase() === t)) return true;
        return false;
      }

      async function showTag(tag) {
        const items = await loadAll();
        const matches = items.filter(i => tagMatches(i, tag));
        tagResults.hidden = false;
        tagResults.innerHTML = `
          <div style="margin-top:1rem;padding:1rem;background:var(--pink-baby,#ffe6f2);border:2px dashed var(--pink-magenta,#ff66b2);border-radius:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;">
              <h3 style="margin:0;">${escapeHtml(tag)} <span style="font-weight:normal;opacity:0.7;">(${matches.length})</span></h3>
              <button id="tag-close" style="background:transparent;border:none;font-size:1.2rem;cursor:pointer;" aria-label="Close">✕</button>
            </div>
            ${matches.length === 0
              ? '<p class="empty-state">no items found.</p>'
              : `<ul style="list-style:none;padding:0;margin:0;display:grid;gap:0.4rem;">
                  ${matches.map(i => `
                    <li style="display:flex;align-items:center;gap:0.6rem;padding:0.4rem;background:white;border-radius:8px;">
                      ${i.cover ? `<img src="${/^https?:/.test(i.cover) ? i.cover : '../' + i.cover}" alt="" loading="lazy" style="width:40px;height:40px;object-fit:cover;border-radius:4px;flex-shrink:0;" onerror="this.style.visibility='hidden'" />` : '<span style="width:40px;height:40px;flex-shrink:0;"></span>'}
                      <a href="../pages/${i.category}.html" style="flex:1;text-decoration:none;color:inherit;">
                        <strong>${escapeHtml(i.title || '')}</strong>
                        <span style="opacity:0.6;font-size:0.85rem;"> · ${ICONS[i.category] || ''} ${escapeHtml(i.category)}</span>
                      </a>
                    </li>
                  `).join('')}
                </ul>`}
          </div>
        `;
        tagResults.querySelector('#tag-close')?.addEventListener('click', () => {
          tagResults.hidden = true;
          tagResults.innerHTML = '';
        });
        tagResults.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      if (stats.topTags && stats.topTags.length) {
        topTags.innerHTML = stats.topTags
          .map(([t, n]) => `<button type="button" data-tag="${escapeHtml(t)}" style="display:inline-block;background:var(--pink-baby);border:2px dashed var(--pink-magenta);border-radius:12px;padding:0.2rem 0.6rem;margin:0.2rem;font:inherit;cursor:pointer;">${escapeHtml(t)} (${n})</button>`)
          .join('');
        topTags.addEventListener('click', e => {
          const btn = e.target.closest('button[data-tag]');
          if (btn) showTag(btn.dataset.tag);
        });
      } else {
        topTags.innerHTML = '<p class="empty-state">no tags yet.</p>';
      }
    })();
  </script>
</body>
</html>
