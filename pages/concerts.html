</head>
<body>
  <div class="page">
    <header class="banner">
      <h1>🎤 concerts</h1>

    </header>
    <nav class="nav" aria-label="Main">
      <a href="../index.html">♡ home</a>
      <a href="./statuses.html">📝 statuses</a>
      <a href="./books.html">📚 books</a>
      <a href="./manga.html">📖 manga</a>
      <a href="./cds.html">💿 cds</a>

      <a href="./anime.html">🌸 anime</a>
      <a href="./tv.html">📺 tv</a>
      <a href="./movies.html">🎬 movies</a>
      <a href="./games.html">🎮 games</a>
      <a href="./characters.html">💕 characters</a>
      <a href="./pokemon.html">🎴 pokemon cards</a>
      <a href="./travel.html">✈️ travel</a>
      <a href="./music.html">🎧 music</a>
      <a href="./stats.html">✨ stats</a>
    </nav>
    <main class="main">
      <section>
        <h2>🎟️ upcoming</h2>
        <div id="upcoming-root"><p class="empty-state">loading…</p></div>
      </section>
      <hr class="cute" />
      <section>
        <h2>✨ past shows</h2>
        <div id="past-root"><p class="empty-state">loading…</p></div>
      </section>
    </main>
  </div>
  <div id="concert-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal concert-modal" role="dialog" aria-modal="true">
      <div class="modal-body"></div>
    </div>
  </div>
  <script src="../js/sparkle.js"></script>
  <script type="module">
    import { injectFooter, highlightNav } from '../js/layout.js';
    highlightNav(); injectFooter();

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // Parse YYYY-MM-DD as a local date (not UTC) so timezone offsets don't
    // shift the day backwards (e.g. "2026-05-05" was being read as May 4 in EDT).
    function parseLocalDate(iso) {
      if (!iso) return null;
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      const d = new Date(iso);
      return isNaN(d) ? null : d;
    }
    function fmtDate(iso) {
      const d = parseLocalDate(iso);
      if (!d) return iso || '';
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function daysUntil(iso) {
      const d = parseLocalDate(iso);
      if (!d) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      d.setHours(0, 0, 0, 0);
      return Math.round((d - today) / 86400000);
    }
    function countdown(days) {
      if (days == null) return '';
      if (days === 0) return '<span class="countdown today">tonight! ✨</span>';
      if (days === 1) return '<span class="countdown soon">tomorrow! 💖</span>';
      if (days <= 7) return `<span class="countdown soon">${days} days!!</span>`;
      if (days <= 30) return `<span class="countdown">${days} days</span>`;
      return `<span class="countdown far">${days} days</span>`;
    }

    function concertCard(c, { upcoming }) {
      const artistImg = c.artistImage
        ? `<img class="concert-artist-img" src="${escapeHtml(c.artistImage)}" alt="${escapeHtml(c.artist || '')}" loading="lazy" onerror="this.style.display='none'" />`
        : '';
      const sentMap = { favorite: '💖 favorite', liked: '💕 liked', neutral: '😐 neutral', disliked: '💔 disliked' };
      const rating = c.sentiment && sentMap[c.sentiment]
        ? `<div class="sentiment-badge" style="display:inline-block;background:var(--pink-baby);color:var(--plum);border:1.5px solid var(--plum);border-radius:999px;padding:0.15rem 0.55rem;font-size:0.78rem;font-weight:700;margin:0.3rem 0 0.1rem;">${sentMap[c.sentiment]}</div>`
        : '';
      const meta = [c.venue, c.city].filter(Boolean).map(escapeHtml).join(' · ');
      const dateStr = fmtDate(c.date);
      const right = upcoming
        ? countdown(daysUntil(c.date))
        : (c.tour ? `<span class="tour">${escapeHtml(c.tour)}</span>` : '');
      const hasMore = !!(c.review || c.notes || (c.photos && c.photos.length) || (c.videos && c.videos.length) || (c.setlist && c.setlist.length));

      return `
        <article class="concert-card ${upcoming ? 'upcoming' : 'past'}${hasMore ? ' clickable' : ''}" ${hasMore ? `data-id="${escapeHtml(c.id)}" role="button" tabindex="0"` : ''}>
          ${artistImg}
          <div class="concert-body">
            <div class="concert-head">
              <div>
                <h3>${escapeHtml(c.title || c.artist || 'untitled show')}</h3>
                ${c.artist && c.artist !== c.title ? `<div class="artist">${escapeHtml(c.artist)}</div>` : ''}
              </div>
              ${right}
            </div>
            <div class="concert-meta">
              <span class="date">${escapeHtml(dateStr)}</span>
              ${meta ? `<span class="dot">·</span><span>${meta}</span>` : ''}
            </div>
            ${rating}
            ${hasMore ? '<div class="concert-more-hint">click for details ♡</div>' : ''}
          </div>
        </article>
      `;
    }

    function ytEmbed(url) {
      // Convert common YouTube/Vimeo URLs into embeddable iframes.
      try {
        const u = new URL(url);
        if (/youtube\.com$/.test(u.hostname) || u.hostname === 'm.youtube.com') {
          const id = u.searchParams.get('v');
          if (id) return `<iframe class="concert-video" src="https://www.youtube.com/embed/${id}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }
        if (u.hostname === 'youtu.be') {
          const id = u.pathname.slice(1);
          if (id) return `<iframe class="concert-video" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`;
        }
        if (/vimeo\.com$/.test(u.hostname)) {
          const id = u.pathname.split('/').filter(Boolean).pop();
          if (id) return `<iframe class="concert-video" src="https://player.vimeo.com/video/${id}" frameborder="0" allowfullscreen></iframe>`;
        }
        if (/\.(mp4|webm|mov)$/i.test(u.pathname)) {
          return `<video class="concert-video" src="${escapeHtml(url)}" controls preload="metadata"></video>`;
        }
      } catch {}
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`;
    }

    function openConcertModal(c) {
      const backdrop = document.getElementById('concert-modal');
      const body = backdrop.querySelector('.modal-body');
      const setlist = Array.isArray(c.setlist) && c.setlist.length
        ? `<details class="setlist" open><summary>setlist (${c.setlist.length} songs)</summary><ol>${c.setlist.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol></details>`
        : '';
      const review = c.review || c.notes
        ? `<div class="review"><h4>review</h4><p>${escapeHtml(c.review || c.notes).replace(/\n/g, '<br>')}</p></div>`
        : '';
      const photos = Array.isArray(c.photos) && c.photos.length
        ? `<div class="concert-photos"><h4>photos</h4><div class="photo-grid">${c.photos.map(u => `<a href="${escapeHtml(u)}" target="_blank" rel="noopener"><img src="${escapeHtml(u)}" alt="" loading="lazy" /></a>`).join('')}</div></div>`
        : '';
      const videos = Array.isArray(c.videos) && c.videos.length
        ? `<div class="concert-videos"><h4>videos</h4>${c.videos.map(ytEmbed).join('')}</div>`
        : '';
      const meta = [c.venue, c.city].filter(Boolean).map(escapeHtml).join(' · ');
      body.innerHTML = `
        <button class="modal-close" aria-label="close">×</button>
        <h3>${escapeHtml(c.title || c.artist || 'untitled show')}</h3>
        ${c.artist && c.artist !== c.title ? `<div class="artist">${escapeHtml(c.artist)}</div>` : ''}
        <div class="concert-meta"><span>${escapeHtml(fmtDate(c.date))}</span>${meta ? ` · <span>${meta}</span>` : ''}</div>
        ${review}
        ${photos}
        ${videos}
        ${setlist}
      `;
      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeConcertModal() {
      const backdrop = document.getElementById('concert-modal');
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

    (async () => {
      const upRoot = document.getElementById('upcoming-root');
      const pastRoot = document.getElementById('past-root');
      let items;
      try {
        const res = await fetch('../data/concerts.json');
        if (!res.ok) throw 0;
        items = await res.json();
      } catch {
        upRoot.innerHTML = pastRoot.innerHTML = '<p class="empty-state">no concerts yet — add some in Notion ♡</p>';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const upcoming = [];
      const past = [];
      for (const c of items) {
        const d = parseLocalDate(c.date);
        if (d && d >= today) upcoming.push(c);
        else past.push(c);
      }
      upcoming.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      past.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      upRoot.innerHTML = upcoming.length
        ? upcoming.map(c => concertCard(c, { upcoming: true })).join('')
        : '<p class="empty-state">no upcoming shows planned ♡</p>';
      pastRoot.innerHTML = past.length
        ? past.map(c => concertCard(c, { upcoming: false })).join('')
        : '<p class="empty-state">no past shows logged yet ♡</p>';

      // Click-to-open modal (event delegation on both roots).
      const byId = new Map(items.map(c => [c.id, c]));
      function handleOpen(e) {
        const card = e.target.closest('.concert-card.clickable');
        if (!card) return;
        if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
        if (e.type === 'keydown') e.preventDefault();
        const c = byId.get(card.dataset.id);
        if (c) openConcertModal(c);
      }
      for (const root of [upRoot, pastRoot]) {
        root.addEventListener('click', handleOpen);
        root.addEventListener('keydown', handleOpen);
      }
      const backdrop = document.getElementById('concert-modal');
      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop || e.target.classList.contains('modal-close')) closeConcertModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && backdrop.classList.contains('open')) closeConcertModal();
      });
    })();
  </script>
</body>
</html>
