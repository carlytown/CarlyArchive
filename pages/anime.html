<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>anime ♡ Carly's Archive</title>
  <link rel="stylesheet" href="../css/theme.css" />
</head>
<body>
  <div class="page">
    <header class="banner">
      <h1>🌸 anime</h1>
      <div class="tagline">~ shows that made me feel things ~</div>
    </header>
    <nav class="nav" aria-label="Main">
      <a href="../index.html">♡ home</a>
      <a href="./statuses.html">📝 statuses</a>
      <a href="./books.html">📚 books</a>
      <a href="./manga.html">📖 manga</a>
      <a href="./cds.html">💿 cds</a>
      <a href="./concerts.html">🎤 concerts</a>
      <a href="./anime.html">🌸 anime</a>
      <a href="./tv.html">📺 tv</a>
      <a href="./movies.html">🎬 movies</a>
      <a href="./games.html">🎮 games</a>
      <a href="./characters.html">💕 characters</a>
      <a href="./pokemon.html">🎴 pokemon cards</a>
      <a href="./travel.html">✈️ travel</a>
      <a href="./music.html">🎧 music</a>
      <a href="./stats.html">✨ stats</a>
    </nav>
    <main class="main">
      <div id="list-controls" class="controls"></div>
      <div id="list-root"></div>
    </main>
  </div>
  <script src="../js/sparkle.js"></script>
  <script type="module">
    import { injectFooter, highlightNav } from '../js/layout.js';
    import { initListView } from '../js/list-view.js';
    highlightNav(); injectFooter();
    initListView({
      category: 'anime',
      sortable: ['dateFinished', 'sentimentRank', 'title', 'year', 'episodeProgress'],
      filterable: ['status', 'genre', 'studio'],
      fields: { cardMeta: ['status', 'studio', 'year'] }
    });

    // Add an "ep X / Y" progress bar to cards.
    let cachedItems = null;
    async function loadItems() {
      if (cachedItems) return cachedItems;
      try {
        const res = await fetch('../data/anime.json');
        if (res.ok) cachedItems = await res.json();
      } catch {}
      return cachedItems || [];
    }
    function renderBars() {
      loadItems().then(items => {
        const map = new Map(items.map(i => [i.id, i]));
        document.querySelectorAll('.card').forEach(card => {
          const item = map.get(card.dataset.id);
          if (!item || card.querySelector('.ep-bar')) return;
          const cur = item.episodeProgress;
          const total = item.episodes;
          if (cur == null && !total) return;
          let label, pct;
          if (cur != null && total) {
            label = `ep ${cur} / ${total}`;
            pct = Math.min(100, (cur / total) * 100);
          } else if (cur != null) {
            label = `ep ${cur}`;
            pct = 0;
          } else {
            label = `${total} eps`;
            pct = 0;
          }
          const bar = document.createElement('div');
          bar.className = 'ep-bar';
          bar.style.cssText = 'margin-top:0.4rem;font-size:0.75rem;color:var(--plum-soft);';
          bar.innerHTML = `
            <div>${label}</div>
            ${cur != null && total ? `<div style="background:var(--pink-baby);border:1px solid var(--pink-magenta);border-radius:6px;height:8px;overflow:hidden;margin-top:2px;">
              <div style="width:${pct}%;height:100%;background:var(--pink-magenta);"></div>
            </div>` : ''}
          `;
          card.appendChild(bar);
        });
      });
    }
    new MutationObserver(renderBars).observe(document.getElementById('list-root'), { childList: true, subtree: true });
    setTimeout(renderBars, 500);
  </script>
</body>
</html>
